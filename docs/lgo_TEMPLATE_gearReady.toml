# If you want to hand-write all your stats from scratch, start with this template.
# Copy an [[item]] block for each piece of gear you want to add to the pool.
# Be sure the 'slot' value is correct and in the correct section.
# E.G. Head items must go in the section which starts with < # --- Head --- >

character = "<YOUR CHARACTER NAME HERE>"
class = "<YOUR CLASS NAME HERE>"
level = 0

[InnateStats]
# Add your raw base stats in this section. The in-game plug-in exports these values for you,
# and the 'resolve-slots' command writes them to this file, but if you want to do it by hand,
# you'll have to take off all your gear to find out what they are. Make sure you have no base-
# stats buffs on when you do.

Might              = 0
Agility            = 0
Vitality           = 0
Will               = 0
Fate               = 0

[Virtues]
# These you must enter by hand. Write the name of each virtue between the quotes.
Virtue1            = ""
Virtue2            = ""
Virtue3            = ""
Virtue4            = ""
Virtue5            = ""

[VirtueInnateStats]
# Virtue-passive masteries. This assumes you have all of them maxed. If you don't, you can go look at what your actual mastery passives are and correct the number here.
PhysicalMastery    = 9275
TacticalMastery    = 9275

