[package]
name    = "lgo"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"
doctest = false

[[bin]]
name = "lgo"
path = "src/main.rs"

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
toml_edit   = "0.22"
quick-xml   = "0.36"
chrono = "0.4.45"
